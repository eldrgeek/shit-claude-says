# The /api/scs/ location as it runs in soma-main (/etc/nginx/sites-available/soma-main)
# on vps.mike-wolf.com, restored 2026-10-21 (bead pm-09nn). Upstream: pm2 `scs-api`
# (/opt/scs-api/server.js = vps-api-server.js) on 127.0.0.1:4242.
# Do not put it on the legacy vpsmikewolf.duckdns.org name: on :443 that name is
# PlayMaker's vhost. The site calls https://vps.mike-wolf.com/api/scs.

location /api/scs/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, x-mod-token" always;
        return 204;
    }
    limit_req zone=soma_gen burst=20 nodelay;
    client_max_body_size 64k;

    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, x-mod-token" always;

    proxy_pass http://127.0.0.1:4242/api/scs/;
    include /etc/nginx/snippets/soma-proxy.conf;
    proxy_read_timeout 15s;
}
